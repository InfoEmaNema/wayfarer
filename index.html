function modalShell(title,content){closeModal();$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row between"><h2 id="modalTitle">${esc(title)}</h2><button class="btn close" data-action="close" aria-label="Close dialog">×</button></div>${content}</section></div>`;trapFocus($('.modal'))}function trapFocus(el){if(modalKeyHandler)document.removeEventListener('keydown',modalKeyHandler);modalObserver?.disconnect();modalKeyHandler=e=>{if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){let f=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]',el).filter(x=>x.offsetParent!==null);if(!f.length)return;let first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};document.addEventListener('keydown',modalKeyHandler);modalObserver=new MutationObserver(()=>{if(!document.body.contains(el))closeModal()});modalObserver.observe(document.body,{childList:true,subtree:true});setTimeout(()=>$('button,input,select,textarea',el)?.focus(),20)}function closeModal(){modalObserver?.disconnect();modalObserver=null;if(modalKeyHandler)document.removeEventListener('keydown',modalKeyHandler);modalKeyHandler=null;$('#modalRoot').innerHTML=''}
function nav(){const icons=['✦','▤','↗','◷','⚙'];let markup=TABS.map((x,i)=>`<button class="nav-btn ${tab===x?'active':''}" data-action="tab" data-tab="${x}">${x}</button>`).join('');$('#topNav').innerHTML=markup;$('#bottomNav').innerHTML=TABS.map((x,i)=>`<button class="${tab===x?'active':''}" data-action="tab" data-tab="${x}" aria-label="${x}"><span>${icons[i]}</span>${x}</button>`).join('')}

function mapSection(pins,kind){let regions=[{name:'Europe',icon:'🏛',accent:'--accent',test:(lat,lng)=>lat>=35&&lat<=72&&lng>=-25&&lng<=45},{name:'Africa',icon:'🌍',accent:'--accent-2',test:(lat,lng)=>lat>=-35&&lat<=37&&lng>=-20&&lng<=52},{name:'Asia',icon:'🏯',accent:'--accent-3',test:(lat,lng)=>lat>=-10&&lat<=80&&lng>=45&&lng<=180},{name:'Oceania',icon:'🏝',accent:'--accent-4',test:(lat,lng)=>lat>=-50&&lat<=0&&lng>=110&&lng<=180},{name:'North America',icon:'🗽',accent:'--warning',test:(lat,lng)=>lat>=15&&lat<=75&&lng>=-170&&lng<=-50},{name:'South America',icon:'🗿',accent:'--accent-2',test:(lat,lng)=>lat>=-56&&lat<=13&&lng>=-82&&lng<=-34},{name:'Middle East',icon:'🕌',accent:'--accent-4',test:(lat,lng)=>lat>=12&&lat<=42&&lng>=25&&lng<=63},{name:'Polar',icon:'❄',accent:'--accent',test:(lat)=>lat<=-60||lat>=80}];let grouped=Object.fromEntries(regions.map(r=>[r.name,[]]));pins.forEach(pin=>{let lat=Number(pin.lat),lng=Number(pin.lng),region=regions.find(r=>r.name==='Polar'&&r.test(lat,lng))||regions.find(r=>r.name==='Middle East'&&r.test(lat,lng))||regions.find(r=>r.name!=='Polar'&&r.name!=='Middle East'&&r.test(lat,lng));if(region)grouped[region.name].push(pin)});return `<section class="card map-wrap"><div class="row between"><h3>Atlas</h3><span class="muted">${kind==='dream'?'Places on your wish list':'Places you have been'}</span></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px">${regions.map(region=>{let places=grouped[region.name],accent=`var(${region.accent})`;return `<article class="card" style="border-top:3px solid ${accent};${places.length?'':'opacity:.5'}"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px"><span aria-hidden="true">${region.icon}</span><strong>${region.name}</strong></div><span class="badge" style="color:${accent};background:color-mix(in srgb,${accent} 16%,var(--card))">${places.length}</span></div>${places.slice(0,4).map(pin=>`<button class="btn small" style="display:block;width:100%;text-align:left;margin:4px 0" data-action="map-pin" data-id="${esc(pin.id)}" data-trip-id="${esc(pin.tripId||'')}">${esc(pin.label)}</button>`).join('')}${places.length>4?`<small class="muted">+${places.length-4} more</small>`:''}</article>`}).join('')}</div></section>`}
function dreamPage(){let countries=[...new Set(state.dreams.map(d=>d.country))].sort(),tags=[...new Set(state.dreams.flatMap(d=>d.tags))].sort(),list=state.dreams.filter(d=>(!dreamFilters.country||d.country===dreamFilters.country)&&(!dreamFilters.priority||d.priority===dreamFilters.priority)&&(!dreamFilters.tag||d.tags.includes(dreamFilters.tag)));return `<p class="eyebrow">The places calling</p><div class="row between"><div><h1>Dream somewhere.</h1><p class="subhead">A little shelf of places for the journeys still ahead.</p></div><div class="row"><button class="btn" data-action="random">Where should I go next?</button><button class="btn primary" data-action="new-dream">＋ Add a place</button></div></div><div class="toolbar"><select class="filter" data-filter="country"><option value="">Every country</option>${countries.map(x=>`<option ${dreamFilters.country===x?'selected':''}>${esc(x)}</option>`)}</select><select class="filter" data-filter="tag"><option value="">Every tag</option>${tags.map(x=>`<option ${dreamFilters.tag===x?'selected':''}>${esc(x)}</option>`)}</select><select class="filter" data-filter="priority"><option value="">Every priority</option>${['high','medium','low'].map(x=>`<option ${dreamFilters.priority===x?'selected':''}>${x}</option>`)}</select></div><div class="grid">${list.map(d=>dreamCard(d)).join('')||'<div class="empty">No places match these filters.</div>'}</div>${mapSection(state.dreams.map(d=>({id:d.id,label:d.place,lat:d.lat,lng:d.lng})),'dream')}</div>`}
function dreamCard(d){return `<article class="card interactive" data-action="dream-detail" data-id="${d.id}"><div class="cover" ${d.imageUrl?`style="background-image:linear-gradient(0deg,#0008,transparent),url('${esc(d.imageUrl)}')"`:''}></div><div class="row between"><span class="badge">${esc(d.priority)} priority</span><span class="muted">${d.estimatedBudget==null?'Budget TBD':formatMoney(d.estimatedBudget)}</span></div><h3>${esc(d.place)}</h3><p class="muted">${esc(d.country)}</p><p>${esc(d.note)}</p><div>${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></article>`}
function tripCard(t){let est=t.budget.reduce((a,b)=>a+(+b.estimated||0),0),actual=t.budget.reduce((a,b)=>a+(+b.actual||0),0),days=t.startDate?daysBetween(today(),t.startDate):0;return `<article class="card interactive" data-action="trip-detail" data-id="${t.id}"><div class="cover" ${t.coverImageUrl?`style="background-image:linear-gradient(0deg,#0008,transparent),url('${esc(t.coverImageUrl)}')"`:``}></div><div class="row between"><span class="badge ${t.state}">${t.state}</span><span class="muted">${t.destinations.length} destination${t.destinations.length===1?'':'s'}</span></div><h3>${esc(t.name)}</h3><p class="muted">${pretty(t.startDate)} — ${pretty(t.endDate)}</p><div class="stats"><div class="stat"><strong>${formatMoney(est)}</strong><small>estimated</small></div><div class="stat"><strong>${formatMoney(actual)}</strong><small>spent</small></div><div class="stat"><strong>${days}</strong><small>${t.state==='planning'?'days to go':'days'}</small></div></div></article>`}
function planPage(){let trips=state.trips.filter(t=>t.state!=='memory');return `<p class="eyebrow">Make room for the details</p><div class="row between"><div><h1>Plan the way.</h1><p class="subhead">Turn a date on the calendar into something to look forward to.</p></div><button class="btn primary" data-action="new-trip">＋ Plan a trip</button></div><div class="grid">${trips.map(tripCard).join('')||'<div class="empty">Your next plan starts here.</div>'}</div>`}
function activeTrip(){return state.trips.find(t=>t.state==='active')||null}function momentMarkup(m,editable=true){return `<article class="card moment"><div class="row between"><div><strong>${esc(m.title)}</strong><div class="muted">${new Intl.DateTimeFormat(state.settings.locale,{hour:'2-digit',minute:'2-digit'}).format(new Date(m.timestamp))} · ${esc(m.place||'Somewhere')}</div></div><span>${m.mood?MOODS[m.mood-1][0]:''} ${m.weather?esc(m.weather):''}</span></div><p>${esc(m.description)}</p>${m.photoUrl?`<img src="${esc(m.photoUrl)}" alt="${esc(m.title)}" loading="lazy" onerror="this.hidden=true">`:''}${editable?`<div class="row"><button class="btn small" data-action="edit-moment" data-id="${m.id}">Edit</button><button class="btn small danger" data-action="delete-moment" data-id="${m.id}">Delete</button></div>`:''}</article>`}
function timeline(t,editable=true,descending=true){let ms=[...t.moments].sort((a,b)=>(descending?1:-1)*(Date.parse(a.timestamp)-Date.parse(b.timestamp))),groups={};ms.forEach(m=>{let day=m.timestamp.slice(0,10);(groups[day]??=[]).push(m)});return Object.entries(groups).map(([d,items])=>`<div class="day-label">${pretty(d)}</div><div class="timeline">${items.map(m=>momentMarkup(m,editable)).join('')}</div>`).join('')||'<div class="empty">No moments yet. Save the small things as they happen.</div>'}
function travelPage(){let t=activeTrip();if(!t)return `<p class="eyebrow">Be where you are</p><h1>The journey, as it happens.</h1><p class="subhead">Start a planned trip when you set off. Your journal will be waiting here.</p><div class="empty">No trip is under way.<br><button class="btn primary" data-action="tab" data-tab="Plan">Find a trip to start</button></div>`;let day=t.startDate?Math.min(daysBetween(t.startDate,t.endDate)+1,daysBetween(t.startDate,today())+1):1;return `<p class="eyebrow">On the road</p><div class="row between"><div><h1>${esc(t.name)}</h1><p class="subhead">${t.destinations.map(d=>esc(d.name)).join(' · ')}</p></div><button class="btn danger" data-action="finish-trip" data-id="${t.id}">Finish trip</button></div><div class="stats"><div class="stat"><strong>Day ${day} of ${Math.max(1,daysBetween(t.startDate,t.endDate)+1)}</strong><small>today's chapter</small></div><div class="stat"><strong>${t.moments.length}</strong><small>moments</small></div><div class="stat"><strong>${new Set(t.moments.map(m=>m.place).filter(Boolean)).size}</strong><small>places visited</small></div><div class="stat"><strong>${formatMoney(t.budget.reduce((a,b)=>a+(+b.actual||0),0))}</strong><small>spent</small></div></div><button class="btn primary" data-action="new-moment">＋ Add a moment</button><section class="section"><h2>Field notes</h2>${timeline(t,true,true)}</section>`}
function memoriesPage(){let memories=state.trips.filter(t=>t.state==='memory'),pins=[];memories.forEach(t=>t.destinations.forEach((d,idx)=>pins.push({id:`${t.id}-${idx}`,tripId:t.id,label:`${t.name} · ${d.name}`,lat:d.lat,lng:d.lng})));return `<p class="eyebrow">The good parts stay</p><h1>Remember the feeling.</h1><p class="subhead">Finished journeys, kept just as they happened.</p><div class="grid">${memories.map(tripCard).join('')||'<div class="empty">The next memory is waiting to be made.</div>'}</div>${mapSection(pins,'memory')}`}
function settingsPage(){return `<p class="eyebrow">Make it yours</p><h1>Settings.</h1><p class="subhead">A few preferences for the way you travel.</p><section class="card"><div class="form-grid"><div class="field"><label>Theme</label><select data-setting="theme"><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Dark</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Light</option></select></div><div class="field"><label>Currency (ISO)</label><input data-setting="currency" value="${esc(state.settings.currency)}" maxlength="3"></div><div class="field"><label>Distance</label><select data-setting="distanceUnit"><option ${state.settings.distanceUnit==='km'?'selected':''}>km</option><option ${state.settings.distanceUnit==='mi'?'selected':''}>mi</option></select></div><div class="field"><label>Date locale</label><input data-setting="locale" value="${esc(state.settings.locale)}" placeholder="it-IT"></div></div><div class="toolbar"><button class="btn" data-action="export-all">Export all data as JSON</button><button class="btn" data-action="import">Import JSON</button><button class="btn danger" data-action="reset">Reset all data</button></div><p class="muted">Your notebook is saved in this browser on this device.</p></section>`}
function render(){document.body.dataset.theme=state.settings.theme;nav();$('#view').innerHTML=tab==='Dream'?dreamPage():tab==='Plan'?planPage():tab==='Travel'?travelPage():tab==='Memories'?memoriesPage():settingsPage()}
function field(label,name,value='',type='text',wide=false,extra=''){return `<div class="field ${wide?'wide':''}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function area(label,name,value='',wide=true){return `<div class="field ${wide?'wide':''}"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}">${esc(value)}</textarea></div>`}function dreamForm(d={}){return `<form id="dreamForm"><div class="form-grid">${field('Place','place',d.place||'')}${field('Country','country',d.country||'')}${field('Latitude','lat',d.lat??'', 'number',false,'step="any"')}${field('Longitude','lng',d.lng??'', 'number',false,'step="any"')}${field('Priority','priority',d.priority||'medium')}${field('Estimated budget','estimatedBudget',d.estimatedBudget??'', 'number')}${field('Tags (comma separated)','tags',(d.tags||[]).join(', '), 'text',true)}${field('Image URL','imageUrl',d.imageUrl||'','url',true)}${area('Note','note',d.note||'')}</div><input type="hidden" name="id" value="${esc(d.id||'')}"><button class="btn primary">Save place</button></form>`}
function tripForm(t={}){let dest=(t.destinations||[])[0]||{};return `<form id="tripForm"><div class="form-grid">${field('Trip name','name',t.name||'')}${field('Start date','startDate',t.startDate||today(),'date')}${field('End date','endDate',t.endDate||today(),'date')}${field('First destination','destName',dest.name||'')}${field('Country','destCountry',dest.country||'')}${field('Latitude','destLat',dest.lat??'','number',false,'step="any"')}${field('Longitude','destLng',dest.lng??'','number',false,'step="any"')}${field('Companions (comma separated)','companions',(t.companions||[]).join(', '),'text',true)}${field('Cover image URL','coverImageUrl',t.coverImageUrl||'','url',true)}${area('Description','description',t.description||'')}</div><input type="hidden" name="id" value="${esc(t.id||'')}"><button class="btn primary">Save trip</button></form>`}
function openDream(id){let d=state.dreams.find(x=>x.id===id);if(!d)return;modalShell(d.place,`<p class="eyebrow">${esc(d.country)} · ${esc(d.priority)} priority</p>${d.imageUrl?`<img class="moment" src="${esc(d.imageUrl)}" alt="${esc(d.place)}">`:''}<p>${esc(d.note)}</p><p>${d.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p><p class="muted">Estimated budget: ${d.estimatedBudget==null?'—':formatMoney(d.estimatedBudget)}</p><div class="toolbar"><button class="btn primary" data-action="dream-plan" data-id="${d.id}">Start planning</button><button class="btn" data-action="edit-dream" data-id="${d.id}">Edit</button><button class="btn danger" data-action="delete-dream" data-id="${d.id}">Delete</button></div>`)}
function openTrip(id){selectedTrip=id;detailSection="Overview";renderTripDetail()}
function memoryExtras(m){let photos=m.moments.filter(x=>x.photoUrl);return `<section class="section"><h3>Photographs</h3><div class="photo-grid">${photos.map(x=>`<img src="${esc(x.photoUrl)}" alt="${esc(x.title)}" onerror="this.hidden=true">`).join('')}</div><h3>Journey timeline</h3>${timeline(m,true,false)}<div class="stats"><div class="stat"><strong>${daysBetween(m.startDate,m.endDate)+1}</strong><small>days</small></div><div class="stat"><strong>${new Set(m.moments.map(x=>x.place).filter(Boolean)).size}</strong><small>places</small></div><div class="stat"><strong>${m.moments.length}</strong><small>moments</small></div></div></section><div class="toolbar"><button class="btn" data-action="export-memory" data-id="${m.id}">Export as Markdown</button><button class="btn" data-action="export-trip-json" data-id="${m.id}">Export as JSON</button></div>`}function renderTripDetail(){let t=state.trips.find(x=>x.id===selectedTrip);if(!t)return;let est=t.budget.reduce((a,b)=>a+(+b.estimated||0),0),actual=t.budget.reduce((a,b)=>a+(+b.actual||0),0),people=t.companions.length+1,sec=detailSection;let content=()=>{if(sec==='Overview')return `<div class="stats"><div class="stat"><strong>${pretty(t.startDate)}</strong><small>departure</small></div><div class="stat"><strong>${pretty(t.endDate)}</strong><small>return</small></div><div class="stat"><strong>${t.destinations.length}</strong><small>destinations</small></div></div><p>${esc(t.description)}</p><p>${t.destinations.map(d=>`<span class="tag">${esc(d.name)}, ${esc(d.country)}</span>`).join('')}</p><div class="row"><button class="btn" data-action="edit-trip" data-id="${t.id}">Edit overview</button>${t.state==='planning'?`<button class="btn primary" data-action="start-trip" data-id="${t.id}">Start this trip</button>`:''}${t.state==='active'?`<button class="btn primary" data-action="tab" data-tab="Travel">Open journal</button>`:''}</div>`;
if(sec==='Itinerary')return `<div class="row between"><h3>Days and activities</h3><button class="btn small" data-action="add-day" data-id="${t.id}">＋ Add day</button></div>${t.itinerary.map((day,i)=>`<article class="card section"><div class="row between"><div><h3>Day ${i+1} · ${esc(day.city)}</h3><span class="muted">${pretty(day.date)}</span></div><button class="btn small" data-action="add-activity" data-day="${day.dayIndex}">＋ Activity</button></div>${day.activities.map(a=>`<div class="item-row"><div><strong>${esc(a.time)} · ${esc(a.title)}</strong><div class="muted">${esc(a.address)} ${a.link?`<a class="link" href="${esc(a.link)}" target="_blank" rel="noopener">Open link</a>`:''}</div><small>${esc(a.notes)}</small></div><button class="btn small" data-action="edit-activity" data-day="${day.dayIndex}" data-id="${a.id}">Edit</button><button class="btn small danger" data-action="delete-activity" data-day="${day.dayIndex}" data-id="${a.id}">×</button></div>`).join('')}</article>`).join('')}`;
if(sec==='Checklist')return `<div class="row"><select id="templateSelect" class="filter">${Object.keys(CHECKLIST_TEMPLATES).map(x=>`<option value="${x}">${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select><button class="btn" data-action="apply-template">Apply template</button></div><div class="progress"><i style="width:${t.checklist.length?100*t.checklist.filter(x=>x.done).length/t.checklist.length:0}%"></i></div><p class="muted">${t.checklist.filter(x=>x.done).length} of ${t.checklist.length} packed</p>${t.checklist.map(c=>`<div class="checkline"><input type="checkbox" data-check="${c.id}" ${c.done?'checked':''}><span>${esc(c.label)}</span><button class="btn small danger" data-action="remove-check" data-id="${c.id}">×</button></div>`).join('')}<form id="checkForm" class="toolbar"><input class="filter" name="label" placeholder="Add an item" required><button class="btn">Add</button></form>`;
if(sec==='Budget')return `<div class="stats"><div class="stat"><strong>${formatMoney(est)}</strong><small>estimated</small></div><div class="stat"><strong>${formatMoney(actual)}</strong><small>actual</small></div><div class="stat"><strong>${formatMoney(actual-est)}</strong><small>delta</small></div><div class="stat"><strong>${formatMoney(actual/people)}</strong><small>per person · ${people}</small></div></div>${t.budget.map(b=>`<div class="item-row"><div><strong>${esc(b.label)}</strong><div class="muted">${esc(b.category)} · estimate ${formatMoney(b.estimated)} · actual ${formatMoney(b.actual)}</div></div><button class="btn small" data-action="edit-budget" data-id="${b.id}">Edit</button><button class="btn small danger" data-action="remove-budget" data-id="${b.id}">×</button></div>`).join('')}<button class="btn" data-action="new-budget">＋ Add budget item</button> <button class="btn" data-action="export-budget" data-id="${t.id}">Export budget as JSON</button>`;
if(sec==='Documents')return `${t.documents.map(d=>`<div class="item-row"><div><strong>${esc(d.title)}</strong><div class="muted">${esc(d.type)} · ${esc(d.reference)} · ${pretty(d.date)}</div><small>${esc(d.notes)}</small>${d.url?`<a class="link" href="${esc(d.url)}" target="_blank" rel="noopener">Open booking</a>`:''}</div><button class="btn small" data-action="edit-document" data-id="${d.id}">Edit</button><button class="btn small danger" data-action="remove-document" data-id="${d.id}">×</button></div>`).join('')}<button class="btn" data-action="new-document">＋ Add document</button>`;
return `<form id="infoForm" class="form-grid">${field('Time zone','timeZone',t.info.timeZone)}${field('Currency','currency',t.info.currency)}${field('Language','language',t.info.language)}${field('Plug type','plugType',t.info.plugType)}${field('Embassy contact','embassy',t.info.embassy,'text',true)}<button class="btn primary wide">Save useful info</button></form>`};let tabs=['Overview','Itinerary','Checklist','Budget','Documents','Useful info'];modalShell(t.name,`<p class="eyebrow"><span class="badge ${t.state}">${t.state}</span> · ${pretty(t.startDate)} — ${pretty(t.endDate)}</p><div class="tabs">${tabs.map(x=>`<button class="btn small ${x===sec?'selected':''}" data-action="trip-section" data-section="${x}">${x}</button>`).join('')}</div><div id="tripContent">${content()}</div>${t.state==='memory'?memoryExtras(t):''}`);$$('[data-action="trip-section"]',$('#modalRoot')).forEach(b=>b.addEventListener('click',()=>{detailSection=b.dataset.section;renderTripDetail()}));}function momentForm(m={}){formLocation=m.lat!=null?{lat:m.lat,lng:m.lng}:null;return `<form id="momentForm"><div class="form-grid">${field('Title','title',m.title||'')}${field('Place','place',m.place||'')}${field('Photo URL','photoUrl',m.photoUrl||'','url',true)}${area('Description','description',m.description||'')}<div class="field wide"><label>Mood</label><div class="moods">${MOODS.map((x,i)=>`<button type="button" class="mood ${m.mood===i+1?'selected':''}" data-action="mood" data-mood="${i+1}" aria-label="${x[1]} mood">${x[0]}</button>`).join('')}</div><input type="hidden" name="mood" value="${m.mood||''}"></div><div class="field"><label for="f-weather">Weather</label><select id="f-weather" name="weather"><option value="">Optional</option>${WEATHERS.map(x=>`<option ${m.weather===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Location pin</label><button type="button" class="btn" data-action="geolocate">Use my location</button><span id="locationStatus" class="muted">${formLocation?'Coordinates added':''}</span></div></div><input type="hidden" name="id" value="${m.id||''}"><button class="btn primary">Save moment</button></form>`}
function auxiliaryForm(kind,d={}){if(kind==='budget')return `<form id="budgetForm"><div class="form-grid"><div class="field"><label>Category</label><select name="category">${['flights','lodging','food','transport','activities','shopping','other'].map(x=>`<option ${d.category===x?'selected':''}>${x}</option>`)}</select></div>${field('Label','label',d.label||'')}${field('Estimated','estimated',d.estimated??0,'number')}${field('Actual','actual',d.actual??0,'number')}</div><input type="hidden" name="id" value="${d.id||''}"><button class="btn primary">Save item</button></form>`;if(kind==='document')return `<form id="documentForm"><div class="form-grid"><div class="field"><label>Type</label><select name="type">${['flight','hotel','train','car','other'].map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`)}</select></div>${field('Title','title',d.title||'')}${field('Reference code','reference',d.reference||'')}${field('Date','date',d.date||'','date')}${field('Booking URL','url',d.url||'','url',true)}${area('Notes','notes',d.notes||'')}</div><input type="hidden" name="id" value="${d.id||''}"><button class="btn primary">Save document</button></form>`;return `<form id="activityForm" class="form-grid"><input type="hidden" name="dayIndex" value="${d.dayIndex??''}"><input type="hidden" name="id" value="${d.id||''}">${field('Time','time',d.time||'09:00')}${field('Title','title',d.title||'')}${field('Address','address',d.address||'')}${field('Link','link',d.link||'','url')}${area('Notes','notes',d.notes||'')}<button class="btn primary wide">Save activity</button></form>`}
function downloadJSON(name,data){let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportTripMarkdown(t){let days={};t.moments.forEach(m=>{let d=m.timestamp.slice(0,10);(days[d]??=[]).push(m)});let body=`# ${t.name}\n\n${pretty(t.startDate)} — ${pretty(t.endDate)}\n\n## Destinations\n${t.destinations.map(x=>`- ${x.name}, ${x.country}`).join('\n')}\n\n`;Object.entries(days).sort().forEach(([d,ms])=>{body+=`## ${pretty(d)}\n\n`+ms.map(m=>`- **${new Date(m.timestamp).toLocaleTimeString(state.settings.locale,{hour:'2-digit',minute:'2-digit'})} ${m.title}**${m.place?` · ${m.place}`:''}\n  ${m.description}`).join('\n')+'\n\n'});body+=`## Stats\n\n- ${daysBetween(t.startDate,t.endDate)+1} days\n- ${new Set(t.moments.map(m=>m.place).filter(Boolean)).size} places\n- ${t.moments.length} moments\n- Spent: ${formatMoney(t.budget.reduce((a,b)=>a+(+b.actual||0),0))}\n`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/markdown'}));a.download=`${t.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function validateImport(x){if(!x||x.version!==1||!Array.isArray(x.dreams)||!Array.isArray(x.trips)||!x.settings||typeof x.settings!=='object')throw Error('The JSON file does not have a Wayfarer data structure.');for(const t of x.trips){if(!TRIP_STATES.includes(t.state)||!Array.isArray(t.moments)||!Array.isArray(t.destinations))throw Error('A trip in this file is incomplete.');if(t.moments.some(m=>!m||!m.timestamp||Number.isNaN(Date.parse(m.timestamp))||!/^\d{4}-\d\d-\d\dT/.test(m.timestamp)))throw Error('A moment has an invalid date.')}return normalizeState(x)}
function readForm(form){return Object.fromEntries(new FormData(form).entries())}function showDreamForm(d){modalShell(d?'Edit a place':'Add a place',dreamForm(d));$('#dreamForm').addEventListener('submit',e=>{e.preventDefault();let x=readForm(e.currentTarget),old=state.dreams.find(v=>v.id===x.id);let item={...old,...x,id:x.id||uid(),lat:clampLat(x.lat),lng:clampLng(x.lng),estimatedBudget:x.estimatedBudget===''?null:Number(x.estimatedBudget),tags:x.tags.split(',').map(y=>y.trim()).filter(Boolean),createdAt:old?.createdAt||today()};if(old)Object.assign(old,item);else state.dreams.push(item);save();closeModal();render();toast('Place saved to your dreams.')})}
function showTripForm(t){modalShell(t?'Edit trip':'Plan a trip',tripForm(t));$('#tripForm').addEventListener('submit',e=>{e.preventDefault();let x=readForm(e.currentTarget),old=state.trips.find(v=>v.id===x.id),start=x.startDate||today(),end=x.endDate||start,trip={...old,...x,id:x.id||uid(),state:old?.state||'planning',startDate:start,endDate:end,destinations:[{name:x.destName,country:x.destCountry,lat:clampLat(x.destLat),lng:clampLng(x.destLng)}].filter(d=>d.name||d.country),companions:x.companions.split(',').map(y=>y.trim()).filter(Boolean),itinerary:old?.itinerary||[],checklist:old?.checklist||[],budget:old?.budget||[],documents:old?.documents||[],moments:old?.moments||[],info:old?.info||{timeZone:'',currency:state.settings.currency,language:'',plugType:'',embassy:''},createdAt:old?.createdAt||today()};if(old)Object.assign(old,trip);else state.trips.push(trip);save();closeModal();render();toast('Trip saved.')})}
function showMomentForm(m){modalShell(m?'Edit moment':'A moment to remember',momentForm(m||{}));$('#momentForm').addEventListener('submit',e=>{e.preventDefault();let x=readForm(e.currentTarget),t=state.trips.find(v=>v.id===selectedTrip);if(!t)return;let old=t.moments.find(v=>v.id===x.id);let moment={...old,...x,id:x.id||uid(),timestamp:old?.timestamp||new Date().toISOString(),lat:formLocation?.lat??old?.lat??null,lng:formLocation?.lng??old?.lng??null,mood:x.mood?Number(x.mood):null,weather:x.weather||null};if(old)Object.assign(old,moment);else t.moments.push(moment);save();closeModal();render();toast('Moment saved.')})}
function formModal(kind,d){modalShell(kind==='budget'?'Budget item':kind==='document'?'Booking details':'Activity details',auxiliaryForm(kind,d));let id={budget:'budgetForm',document:'documentForm',activity:'activityForm'}[kind];$('#'+id).addEventListener('submit',e=>{e.preventDefault();let x=readForm(e.currentTarget),t=state.trips.find(v=>v.id===selectedTrip);if(!t)return;let list=kind==='budget'?t.budget:kind==='document'?t.documents:t.itinerary.find(y=>String(y.dayIndex)===String(x.dayIndex))?.activities; if(!list)return;let old=list.find(v=>v.id===x.id),value={...old,...x,id:x.id||uid()};if(kind==='budget'){value.estimated=Number(x.estimated)||0;value.actual=Number(x.actual)||0;value.currency=state.settings.currency}if(old)Object.assign(old,value);else list.push(value);save();renderTripDetail()})}
function handleSubmit(e){let f=e.target;if(f.id==='checkForm'){e.preventDefault();let t=state.trips.find(x=>x.id===selectedTrip);t.checklist.push({id:uid(),label:new FormData(f).get('label').trim(),done:false});save();renderTripDetail()}if(f.id==='infoForm'){e.preventDefault();let t=state.trips.find(x=>x.id===selectedTrip);t.info=Object.assign(t.info,readForm(f));save();toast('Useful information saved.');renderTripDetail()}}
document.addEventListener('submit',handleSubmit);document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){dreamFilters[e.target.dataset.filter]=e.target.value;render()}if(e.target.matches('[data-setting]')){state.settings[e.target.dataset.setting]=e.target.value;save();render()}if(e.target.matches('[data-check]')){let t=state.trips.find(x=>x.id===selectedTrip),c=t?.checklist.find(x=>x.id===e.target.dataset.check);if(c)c.done=e.target.checked;save();renderTripDetail()}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id,t=state.trips.find(x=>x.id===selectedTrip);if(a==='tab'){tab=el.dataset.tab;render();return}if(a==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render();return}if(a==='close'||(a==='backdrop'&&e.target===el)){closeModal();return}if(a==='new-dream'){showDreamForm();return}if(a==='dream-detail'){openDream(id);return}if(a==='edit-dream'){let d=state.dreams.find(x=>x.id===id);showDreamForm(d);return}if(a==='delete-dream'){if(confirm('Remove this place from your dreams?')){state.dreams=state.dreams.filter(x=>x.id!==id);save();closeModal();render()}return}if(a==='dream-plan'){let d=state.dreams.find(x=>x.id===id);closeModal();showTripForm({name:`${d.place} trip`,destinations:[{name:d.place,country:d.country,lat:d.lat,lng:d.lng}],description:d.note});return}if(a==='random'){if(!state.dreams.length){toast('Add a place to your dream list first.');return}let weight={low:1,medium:2,high:4},pool=state.dreams.flatMap(d=>Array(weight[d.priority]||1).fill(d));openDream(pool[Math.floor(Math.random()*pool.length)].id);return}if(a==='new-trip'){showTripForm();return}if(a==='trip-detail'){openTrip(id);return}if(a==='edit-trip'){showTripForm(state.trips.find(x=>x.id===id));return}if(a==='start-trip'){let other=activeTrip();if(other&&other.id!==id){toast('Finish the current trip before starting another.');return}let x=state.trips.find(v=>v.id===id);x.state='active';state.activeTripId=x.id;save();tab='Travel';render();closeModal();toast('Your trip has started.');return}if(a==='finish-trip'){let x=state.trips.find(v=>v.id===id);x.state='memory';state.activeTripId=null;save();render();toast('Trip saved to Memories.');return}if(a==='new-moment'){selectedTrip=state.activeTripId;showMomentForm();return}if(a==='edit-moment'){selectedTrip=state.activeTripId||selectedTrip;showMomentForm(state.trips.find(v=>v.id===selectedTrip)?.moments.find(m=>m.id===id));return}if(a==='delete-moment'){let x=state.trips.find(v=>v.id===selectedTrip);x.moments=x.moments.filter(m=>m.id!==id);save();render();return}if(a==='mood'){let f=$('#momentForm');f.elements.mood.value=el.dataset.mood;$$('.mood',f).forEach(b=>b.classList.toggle('selected',b===el));return}if(a==='geolocate'){if(!navigator.geolocation){toast('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(pos=>{formLocation={lat:clampLat(pos.coords.latitude),lng:clampLng(pos.coords.longitude)};$('#locationStatus').textContent='Coordinates added';toast('Location added to this moment.')},()=>toast('Location was not shared. You can save your moment without it.'));return}if(a==='map-pin'){if(tab==='Dream')openDream(el.dataset.id);else openTrip(el.dataset.tripId||el.dataset.id);return}if(a==='new-budget'){formModal('budget');return}if(a==='edit-budget'){formModal('budget',t.budget.find(x=>x.id===id));return}if(a==='remove-budget'){t.budget=t.budget.filter(x=>x.id!==id);save();renderTripDetail();return}if(a==='export-budget'){downloadJSON(`${t.name}-budget.json`,{currency:state.settings.currency,items:t.budget,estimated:t.budget.reduce((n,x)=>n+(+x.estimated||0),0),actual:t.budget.reduce((n,x)=>n+(+x.actual||0),0)});return}if(a==='new-document'){formModal('document');return}if(a==='edit-document'){formModal('document',t.documents.find(x=>x.id===id));return}if(a==='remove-document'){t.documents=t.documents.filter(x=>x.id!==id);save();renderTripDetail();return}if(a==='add-day'){let date=addDays(t.endDate,1);t.endDate=date;t.itinerary.push({dayIndex:t.itinerary.length,date,city:t.destinations[0]?.name||'',activities:[]});save();renderTripDetail();return}if(a==='add-activity'){let day=t.itinerary.find(x=>String(x.dayIndex)===el.dataset.day);if(!day)return;formModal('activity',{dayIndex:day.dayIndex});return}if(a==='edit-activity'){let day=t.itinerary.find(x=>String(x.dayIndex)===el.dataset.day),act=day?.activities.find(x=>x.id===id);if(act){formModal('activity',{...act,dayIndex:day.dayIndex})}return}if(a==='delete-activity'){let day=t.itinerary.find(x=>String(x.dayIndex)===el.dataset.day);day.activities=day.activities.filter(x=>x.id!==id);save();renderTripDetail();return}if(a==='apply-template'){let values=CHECKLIST_TEMPLATES[$('#templateSelect').value];t.checklist.push(...values.map(label=>({id:uid(),label,done:false})));save();renderTripDetail();return}if(a==='remove-check'){t.checklist=t.checklist.filter(x=>x.id!==id);save();renderTripDetail();return}if(a==='export-all'){downloadJSON('wayfarer-backup.json',state);return}if(a==='export-memory'){exportTripMarkdown(state.trips.find(x=>x.id===id));return}if(a==='export-trip-json'){downloadJSON(`${state.trips.find(x=>x.id===id).name}.json`,state.trips.find(x=>x.id===id));return}if(a==='import'){$('<input type="file" accept="application/json">').click();return}if(a==='reset'){if(confirm('Reset all Wayfarer data?')&&confirm('This replaces this browser’s data with the sample notebook. Continue?')){state=normalizeState(demoState());save();tab='Dream';render();toast('Sample notebook restored.')}return}});
document.addEventListener('change',e=>{if(e.target.type==='file'){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=validateImport(JSON.parse(reader.result));if(confirm('Replace your Wayfarer notebook with this import?')){state=normalizeState(parsed);save();render();toast('Import complete.')}}catch(err){toast(err.message||'This file could not be imported.')}};reader.onerror=()=>toast('Could not read that file.');reader.readAsText(file)}});
